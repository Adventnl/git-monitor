name: Desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
            bundle: nsis
          - os: macos-15
            artifact: macos-arm64
            bundle: app,dmg
          - os: macos-15-intel
            artifact: macos-x64
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Require GitHub OAuth App client ID
        shell: bash
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
        run: test -n "$GITHUB_CLIENT_ID" || { echo 'Set the GH_OAUTH_CLIENT_ID repository secret before building a release.' >&2; exit 1; }
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before building a release.' >&2; exit 1; }
      - run: npm ci
      - name: Import Windows signing certificate when configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\git-monitor.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\git-monitor.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $password
      - name: Build desktop installer
        shell: bash
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Name Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $bundle = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$bundle) { throw 'NSIS installer was not produced' }
          Copy-Item $bundle.FullName release/git-monitor-Setup-x64.exe
          Copy-Item "$($bundle.FullName).sig" release/git-monitor-Setup-x64.exe.sig
      - name: Name macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          if [ "${{ matrix.artifact }}" = macos-arm64 ]; then arch=arm64; else arch=x64; fi
          cp "$dmg" "release/git-monitor-macOS-${arch}.dmg"
          updater=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          test -n "$updater" && test -s "$updater.sig"
          cp "$updater" "release/git-monitor-macOS-${arch}.app.tar.gz"
          cp "$updater.sig" "release/git-monitor-macOS-${arch}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Build updater manifest
        run: node scripts/generate-update-manifest.mjs release
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release/* --title "git-monitor $GITHUB_REF_NAME" --generate-notes
